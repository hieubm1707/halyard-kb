name: daily-sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kb-sync .
      - name: Run sync
        env:
          API_KEY: ${{ secrets.API_KEY }}
          FILE_SEARCH_STORE: ${{ vars.FILE_SEARCH_STORE }}
        run: docker run --rm -e API_KEY -e FILE_SEARCH_STORE kb-sync
